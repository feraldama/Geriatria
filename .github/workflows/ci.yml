name: CI

# Puerta de calidad antes de mergear. En un sistema con datos de salud, nada
# debería llegar a main sin que compile, pase el lint y pase los tests.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Base efímera para los tests de integración.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geriatria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geriatria_test?schema=public
      JWT_SECRET: secreto-solo-para-ci-con-longitud-suficiente
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter @geriatria/api run db:generate

      - name: Compilar paquetes compartidos
        run: pnpm --filter @geriatria/schemas run build

      - name: Aplicar migraciones
        run: pnpm --filter @geriatria/api exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Verifica que las imágenes de producción sigan construyendo.
      - name: Build imagen API
        run: docker build -f apps/api/Dockerfile -t geriatria-api:ci .
      - name: Build imagen Web
        run: docker build -f apps/web/Dockerfile -t geriatria-web:ci .
